syntax = "proto3";

package katartismos;

option go_package = "github.com/katastroma/katartismos";

// ProvisionerService applies manifests to a cluster and prunes resources
// no longer in the rendered output.
service ProvisionerService {
  rpc Provision(stream ProvisionRequest) returns (ProvisionResponse);
}

// Streamed manifests to be applied.
//
// tenant and deployer_sa are read from the
// first message only — they do not change across the stream. Consider using a
// oneof to separate metadata from data chunks if this becomes a concern.
message ProvisionRequest {
  bytes data = 1;
  string tenant = 2;
  string deployer_sa = 3;
}

// Provision result.
message ProvisionResponse {}
