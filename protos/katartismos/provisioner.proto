syntax = "proto3";

package katartismos;

option go_package = "github.com/katastroma/katartismos";

// ProvisionerService applies Kubernetes manifests to a cluster.
service ProvisionerService {
  rpc Provision(stream ProvisionRequest) returns (stream ProvisionResponse);
}

// Streamed Kubernetes manifest.
message ProvisionRequest {
  bytes manifest = 1;
}

// Provisioned Kubernetes manifest.
message ProvisionResponse {
  bytes manifest = 1;
}
